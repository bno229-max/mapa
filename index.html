<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Calor Dinâmico - Restaurantes</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAyeljGisp0yk242H4s3VC_xFeBwESDrjU&libraries=visualization,places"></script>
    <style>
        #map { height: 600px; width: 100%; border-radius: 10px; }
        body { font-family: Arial, sans-serif; }
        .painel { padding: 15px; background: #222; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="painel">
        <strong>Status: </strong> <span id="status">Carregando restaurantes...</span>
    </div>

    <div id="map"></div>

    <script>
        let map, service, heatmap;

        function initMap() {
            // Centraliza em São Paulo (Av. Paulista)
            const centro = { lat: -23.5615, lng: -46.6623 };
            
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 15,
                center: centro,
                mapTypeId: 'roadmap'
            });

            const request = {
                location: centro,
                radius: '1500', // 1.5km
                type: ['restaurant'],
                openNow: true
            };

            service = new google.maps.places.PlacesService(map);
            
            service.nearbySearch(request, (results, status) => {
                const statusElement = document.getElementById("status");
                
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    const totalAbertos = results.length;
                    statusElement.innerHTML = `Sucesso! Encontrados ${totalAbertos} estabelecimentos abertos.`;

                    // Extrair coordenadas para o heatmap
                    const heatData = results.map(place => {
                        return place.geometry.location;
                    });
                    
                    renderHeatmap(heatData, totalAbertos);
                } else {
                    statusElement.innerHTML = "Erro ao buscar dados: " + status;
                }
            });
        }

        function renderHeatmap(points, total) {
            let cores;

            // Lógica de cores baseada na sua regra
            if (total > 30) {
                cores = [
                    "rgba(0, 255, 0, 0)", 
                    "rgba(0, 255, 0, 1)"  // VERDE
                ];
            } else if (total >= 15) {
                cores = [
                    "rgba(255, 255, 0, 0)", 
                    "rgba(255, 255, 0, 1)"  // AMARELO
                ];
            } else {
                cores = [
                    "rgba(255, 0, 0, 0)", 
                    "rgba(255, 0, 0, 1)"  // VERMELHO
                ];
            }

            heatmap = new google.maps.visualization.HeatmapLayer({
                data: points,
                map: map,
                radius: 50, // Aumentei o raio para ficar mais visível
                opacity: 0.8,
                gradient: cores
            });
        }

        // Inicia o mapa após o carregamento da página
        window.onload = initMap;
    </script>
</body>
</html>
